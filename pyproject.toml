[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "culturecentro"
version = "0.1.0"
description = "Agrégation de la programmation culturelle des salles du centre-ville de Sherbrooke."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "remtav" }]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
dev = [
    "coverage>=7",
]

[project.urls]
Homepage = "https://github.com/remtav/culturecentro"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["culturecentro"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:"]
# Seuil mesuré sur l'ensemble du paquet. L'ancien .coveragerc ne couvrait que
# theatre_granada (d'où 85 %) ; lapetiteboitenoire était ignoré. À remonter
# vers 85 % lorsque le cœur partagé sera extrait et lapetiteboitenoire testé.
fail_under = 70

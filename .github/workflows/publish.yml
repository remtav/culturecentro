name: Publier le feed et la maquette

# Génère le feed agrégé (web/data/evenements.json) puis déploie le dossier
# web/ sur GitHub Pages. Requiert : Settings → Pages → Source = GitHub Actions.

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours à 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/culturecentro/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois ; on n'interrompt pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le paquet
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Générer le feed agrégé
        run: |
          mkdir -p web/data
          python -m culturecentro lister --format json -o web/data/evenements.json \
            || echo "[]" > web/data/evenements.json

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Téléverser l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Déployer sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4

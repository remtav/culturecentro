name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le paquet (dont outils de qualité)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer le paquet (dont pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lancer les tests
        run: python -m pytest

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le paquet (dont coverage)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Mesurer la couverture
        run: |
          python -m coverage run -m pytest
          python -m coverage report -m

      - name: Ajouter le rapport au résumé de l'exécution
        if: always()
        run: |
          {
            echo '### Couverture des tests'
            echo '```'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier le seuil minimal
        run: python -m coverage report

      - name: Régénérer le badge
        run: python scripts/coverage_badge.py -o coverage.svg

      - name: Publier le badge mis à jour
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          if ! git diff --quiet -- coverage.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add coverage.svg
            git commit -m "Mettre à jour le badge de couverture [skip ci]"
            git push
          fi
